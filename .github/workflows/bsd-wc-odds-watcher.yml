name: Lab — Polling cotes BSD CDM2026 (quotidien)

# Quotidien à 10h UTC.
# Objectif: détecter dès que BSD agrège des cotes sur les 72 matchs de poule
# CDM2026 (actuellement bookmakers_count=0 partout). Déclenche la Passe 1
# (triple inversion Dixon-Coles en prod) dès transition 0 -> >0.
on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      sample:
        description: "Nombre de matchs à sonder (10 = MD1 + chocs, 72 = complet)"
        required: false
        default: "10"

permissions:
  contents: write

concurrency:
  group: bsd-wc-odds-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps minimales
        run: |
          python -m pip install --upgrade pip
          pip install "requests>=2.31.0"

      - name: Poll BSD CDM2026 odds coverage
        id: poll
        continue-on-error: true
        env:
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
        run: |
          set +e
          python scripts/bsd_wc_odds_watcher.py \
            --sample "${{ github.event.inputs.sample || '10' }}"
          rc=$?
          echo "rc=$rc" >> $GITHUB_OUTPUT
          echo "Polling exit code: $rc"
          exit 0

      - name: Détection flag d'ouverture
        if: always()
        id: flag
        run: |
          if [ -f .local/bsd_wc_odds_ready.flag ]; then
            echo "ready=true" >> $GITHUB_OUTPUT
            echo "::warning::FLAG d'ouverture détecté — les cotes BSD CDM sont ouvertes !"
            cat .local/bsd_wc_odds_ready.flag
          else
            echo "ready=false" >> $GITHUB_OUTPUT
            echo "Toujours en attente — aucune cote BSD ouverte sur l'échantillon."
          fi

      - name: Persister coverage log + flag sur main
        if: always()
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add live/data/bsd_wc_coverage.jsonl 2>/dev/null || true
          git add .local/bsd_wc_odds_ready.flag 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Pas de nouveautés — rien à committer."
          else
            msg="chore(lab): polling BSD CDM2026 (run #${{ github.run_number }})"
            if [ "${{ steps.flag.outputs.ready }}" = "true" ]; then
              msg="$msg — FLAG OUVERTURE COTES DÉTECTÉ"
            fi
            git commit -m "$msg"
            if ! git pull --rebase origin main; then
              echo "::error::git pull --rebase échoué"
              exit 1
            fi
            if ! git push origin HEAD:main; then
              echo "::error::push échoué"
              exit 1
            fi
          fi

      - name: Gate erreur réseau
        if: always()
        run: |
          rc="${{ steps.poll.outputs.rc }}"
          if [ "$rc" = "2" ]; then
            echo "::error::Polling a échoué (erreur réseau ou BSD KO)"
            exit 1
          fi
