name: Lab — Snapshot cotes bi-quotidien (Phase 5)

# 2x/jour : 09:00 et 19:00 UTC.
# Objectif: accumuler ~3 semaines d'observations pour analyse prédictive
# du signal sharp (SHORTENING / DRIFTING) sur le forward log ouvert.
on:
  schedule:
    - cron: "0 9 * * *"
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      markets:
        description: "Marchés à snapshot (CSV: 1x2,over_under_25,btts)"
        required: false
        default: "1x2"
      limit:
        description: "Limite max d'events (0 = tous)"
        required: false
        default: "0"
      alert_threshold:
        description: "Alerte si > N events sans snapshot 24h"
        required: false
        default: "50"

permissions:
  contents: write

concurrency:
  group: lab-snapshot-odds
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lab-snapshot-${{ hashFiles('artifacts/football-lab/requirements.txt') }}

      - name: Install deps minimales
        run: |
          python -m pip install --upgrade pip
          # Seul `requests` est nécessaire pour le BSD client.
          pip install "requests>=2.31.0"

      - name: Snapshot des cotes (Phase 5)
        id: snapshot
        # On ne fail PAS le job ici : même si le script retourne 2 (alerte
        # > N events sans snapshot 24h), il faut quand même persister les
        # lignes éventuellement écrites avant. Le verdict final est rendu
        # par l'étape "Gate alerte" plus bas.
        continue-on-error: true
        env:
          BSD_API_KEY: ${{ secrets.BSD_API_KEY }}
        run: |
          set +e
          python scripts/lab_snapshot_cron.py \
            --markets "${{ github.event.inputs.markets || '1x2' }}" \
            --limit "${{ github.event.inputs.limit || '0' }}" \
            --alert-threshold "${{ github.event.inputs.alert_threshold || '50' }}"
          rc=$?
          echo "rc=$rc" >> $GITHUB_OUTPUT
          echo "Snapshot script exit code: $rc"
          # On sort 0 quoi qu'il arrive : la gate finale décidera.
          exit 0

      - name: Persister movement_history.jsonl sur main
        # Toujours s'exécuter, même si l'étape snapshot a alerté (rc=2)
        # ou échoué pour une autre raison : on ne perd jamais les lignes
        # déjà écrites en append-only.
        if: always()
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add artifacts/football-lab/lab/data/movement_history.jsonl 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Pas de nouvelles lignes — rien à committer."
          else
            lines=$(wc -l < artifacts/football-lab/lab/data/movement_history.jsonl)
            git commit -m "chore(lab): snapshot cotes Phase 5 (run #${{ github.run_number }}, total $lines lignes)"
            if ! git pull --rebase origin main; then
              echo "::error::git pull --rebase a échoué — abandon du push pour éviter un état incohérent"
              exit 1
            fi
            if ! git push origin HEAD:main; then
              echo "::error::push movement_history échoué"
              exit 1
            fi
          fi

      - name: Gate alerte (échec job si seuil dépassé)
        # Rendu après persistance : on fait échouer le job uniquement si le
        # script a remonté l'alerte (> N events ouverts sans snapshot 24h)
        # ou s'il a planté pour une autre raison. Les données ont déjà été
        # commitées à ce stade.
        if: always()
        run: |
          rc="${{ steps.snapshot.outputs.rc }}"
          echo "Snapshot script rc=$rc"
          if [ "$rc" != "0" ]; then
            echo "::error::Snapshot script a retourné $rc (alerte ou erreur). Voir logs ci-dessus."
            exit 1
          fi
