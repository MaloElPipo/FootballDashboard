name: Scrape carrière TM hebdomadaire

# Weekly creation + hourly observation/resumption of an EXISTING queue.
# GitHub cron can be delayed; no punctuality or source-access guarantee.
on:
  schedule:
    - cron: "15 3 * * 1"
    - cron: "15 4 * * 1"
    - cron: "37 * * * *"
  workflow_dispatch:
    inputs:
      leagues:
        description: "Ligues d'une nouvelle campagne ; vide = toutes"
        default: ""
      campaign_id:
        description: "Campagne durable existante ; vide = reprendre l'active ou créer"
        default: ""
      skip_scrape:
        description: "Reconstruction seule, sans modifier la file"
        default: "false"
        type: choice
        options: ["false", "true"]
      refresh_squads:
        description: "Rafraîchir les effectifs une fois par ligue/campagne"
        default: "true"
        type: choice
        options: ["true", "false"]
      retry_round:
        description: "Compatibilité anciens déclencheurs ; les reprises sont gérées par la file"
        default: "0"

permissions:
  contents: write
  actions: read
  pages: read

# ALL queue writers must use this same group. No dispatch from a worker.
concurrency:
  group: scrape-weekly
  cancel-in-progress: false

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
      TM_CHECKPOINT_REMOTE: github
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Autoriser la création uniquement au créneau hebdomadaire
        id: gate
        env:
          TRIGGER_SCHEDULE: ${{ github.event.schedule }}
        run: |
          CREATE=false
          OFFSET=$(TZ=Europe/Paris date +%z)
          case "$TRIGGER_SCHEDULE:$OFFSET" in
            ":"*|"15 3 * * 1:+0200"|"15 4 * * 1:+0100") CREATE=true ;;
          esac
          echo "create=$CREATE" >> "$GITHUB_OUTPUT"

      - name: Rattacher la file durable et vérifier les publications précédentes
        id: queue
        if: inputs.skip_scrape != 'true'
        working-directory: artifacts/football-dashboard
        env:
          REQUESTED_LEAGUES: ${{ inputs.leagues }}
          REQUESTED_CAMPAIGN: ${{ inputs.campaign_id }}
          REFRESH_SQUADS: ${{ inputs.refresh_squads }}
          ALLOW_CREATE: ${{ steps.gate.outputs.create }}
        run: python3 scripts/collection_queue.py prepare

      - name: Installer le navigateur seulement si la file autorise une collecte
        if: steps.queue.outputs.ready == 'true'
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Collecter les ligues éligibles avec bilan durable
        id: collect
        if: steps.queue.outputs.ready == 'true'
        working-directory: artifacts/football-dashboard
        env:
          TM_CAMPAIGN_ID: ${{ steps.queue.outputs.campaign }}
        run: python3 scripts/collection_queue.py collect

      - name: Filtrer la saison courante
        id: current
        if: ${{ !cancelled() && (steps.queue.outputs.ready == 'true' || inputs.skip_scrape == 'true') }}
        working-directory: artifacts/football-dashboard
        run: python3 scripts/make_current_season.py

      - name: Persister les CSV validés sans supprimer les exports précédents
        id: persist
        if: ${{ !cancelled() && steps.queue.outputs.ready == 'true' && steps.current.outcome == 'success' }}
        run: |
          python3 artifacts/football-dashboard/career_export_transaction.py artifacts/football-dashboard/live/data/tm_career
          python3 artifacts/football-dashboard/career_export_transaction.py artifacts/football-dashboard/live/data/tm_career_current --current
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          find artifacts/football-dashboard/live/data/tm_scrap -maxdepth 1 -name '*.csv' -print0 | xargs -0 -r git add --
          find artifacts/football-dashboard/live/data/tm_career -maxdepth 1 -type f \
            \( -name '*_summary.csv' -o -name '*_career.csv' -o -name '*_matches.csv' -o -name '*_competitions_seen.csv' -o -name '*_collection.json' \) \
            -print0 | xargs -0 -r git add --force --
          find artifacts/football-dashboard/live/data/tm_career_current -maxdepth 1 -type f \
            \( -name '*_career.csv' -o -name '*_matches.csv' \) \
            -print0 | xargs -0 -r git add --force --
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): collecte campagne ${{ steps.queue.outputs.campaign }}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Construire le portail et les deux archives par ligue
        id: build
        if: ${{ !cancelled() && steps.current.outcome == 'success' && (steps.persist.outcome == 'success' || inputs.skip_scrape == 'true') }}
        working-directory: artifacts/football-dashboard
        run: python3 scripts/build_pages.py

      - name: Enregistrer les empreintes CSV attendues avant publication
        id: seal
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.queue.outputs.ready == 'true' }}
        working-directory: artifacts/football-dashboard
        env:
          TM_CAMPAIGN_ID: ${{ steps.queue.outputs.campaign }}
        run: python3 scripts/collection_queue.py seal

      - name: Préserver toutes les archives de ligues déjà publiques
        id: preserve
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: artifacts/football-dashboard
        run: python3 scripts/collection_queue.py guard

      - name: Déployer les archives
        if: ${{ !cancelled() && steps.preserve.outcome == 'success' && (steps.seal.outcome == 'success' || inputs.skip_scrape == 'true') }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./artifacts/football-dashboard/gh_pages_build
          publish_branch: gh-pages
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "chore(pages): campagne ${{ steps.queue.outputs.campaign }}"
          force_orphan: true

      - name: Bilan par ligue (publication publique vérifiée au prochain passage)
        if: ${{ always() && steps.queue.outputs.ready == 'true' }}
        working-directory: artifacts/football-dashboard
        env:
          TM_CAMPAIGN_ID: ${{ steps.queue.outputs.campaign }}
        run: python3 scripts/collection_queue.py finish
