name: Scrape carrière TM hebdomadaire

# Tous les mardis à 4h UTC = 5h Paris (hiver) / 6h Paris (été)
# Choix demandé par l'utilisateur : nuit du lundi au mardi à 5h du matin.
on:
  schedule:
    - cron: "0 4 * * 2"
  workflow_dispatch:
    inputs:
      leagues:
        description: "Liste optionnelle de ligues (séparées par virgules) — vide = toutes"
        required: false
        default: ""
      skip_scrape:
        description: "Sauter le scraping (utiliser les CSV existants pour rebâtir la page)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: write

concurrency:
  group: scrape-weekly
  cancel-in-progress: false

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 720   # 12h max — 74 ligues × ~5 min = ~6h pour un run complet

    steps:
      - name: Checkout du dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('artifacts/football-dashboard/requirements.txt') }}

      - name: Install dépendances minimales
        run: |
          # Le scraper TM ceapi n'utilise que la stdlib Python.
          # Pas besoin d'installer requirements.txt complet.
          python -m pip install --upgrade pip
          # On importe leagues_master qui n'a aucune dépendance.

      - name: Lister les ligues à scraper
        id: list_leagues
        working-directory: artifacts/football-dashboard
        run: |
          if [ -n "${{ github.event.inputs.leagues }}" ]; then
            echo "leagues=${{ github.event.inputs.leagues }}" >> $GITHUB_OUTPUT
            echo "→ Ligues spécifiques demandées : ${{ github.event.inputs.leagues }}"
          else
            # Récupère toutes les ligues depuis la config maître
            LEAGUES=$(python3 -c "
          from live.leagues_master import LEAGUES
          print(','.join(l['code_tm'].lower() for l in LEAGUES))
          ")
            echo "leagues=$LEAGUES" >> $GITHUB_OUTPUT
            echo "→ Toutes les ligues (74)"
          fi

      - name: Vérifier prérequis pour scraping (effectifs déjà scrapés)
        if: github.event.inputs.skip_scrape != 'true'
        working-directory: artifacts/football-dashboard
        run: |
          # Le scraper carrière a besoin de live/data/tm_scrap/{league}.csv en input
          # (liste des joueurs par championnat). On signale juste les manques.
          mkdir -p live/data/tm_scrap
          IFS=',' read -ra LIST <<< "${{ steps.list_leagues.outputs.leagues }}"
          MISSING=""
          PRESENT=""
          for code in "${LIST[@]}"; do
            f="live/data/tm_scrap/${code}.csv"
            if [ -f "$f" ] && [ $(wc -l < "$f") -gt 1 ]; then
              PRESENT="$PRESENT $code"
            else
              MISSING="$MISSING $code"
            fi
          done
          echo "✓ Effectifs présents :$PRESENT"
          echo "✗ Effectifs manquants (à scraper) :$MISSING"

      - name: Scraping effectifs (squads) pour ligues sans CSV
        if: github.event.inputs.skip_scrape != 'true'
        working-directory: artifacts/football-dashboard
        run: |
          IFS=',' read -ra LIST <<< "${{ steps.list_leagues.outputs.leagues }}"
          OK=0
          KO=0
          SKIPPED=0
          for code in "${LIST[@]}"; do
            f="live/data/tm_scrap/${code}.csv"
            if [ -f "$f" ] && [ $(wc -l < "$f") -gt 1 ]; then
              SKIPPED=$((SKIPPED+1))
              continue
            fi
            echo "::group::Scraping effectifs $code"
            if python3 scripts/scrape_all_squads.py --only "$code"; then
              OK=$((OK+1))
            else
              echo "::warning::Échec scraping effectifs $code"
              KO=$((KO+1))
            fi
            echo "::endgroup::"
          done
          echo "Bilan effectifs : $OK scrapés / $KO échecs / $SKIPPED déjà présents"

      - name: Persister les nouveaux effectifs sur main
        if: github.event.inputs.skip_scrape != 'true'
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add artifacts/football-dashboard/live/data/tm_scrap/*.csv 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Aucun nouveau CSV effectif à committer."
          else
            git commit -m "chore(data): nouveaux effectifs scrapés (run #${{ github.run_number }})"
            git push origin HEAD:main || echo "::warning::push effectifs échoué (continuera quand même)"
          fi

      - name: Scraping carrière des joueurs (par ligue, séquentiel)
        if: github.event.inputs.skip_scrape != 'true'
        working-directory: artifacts/football-dashboard
        # timeout-minutes : limite dure à 5h pour rester sous le plafond GitHub (6h/job).
        # continue-on-error : si la limite est atteinte ou qu'une ligue bloque,
        # les étapes suivantes (filtrage, build, déploiement) tournent quand même
        # avec les CSV déjà produits — portail partiel plutôt que pas de portail.
        timeout-minutes: 300
        continue-on-error: true
        run: |
          IFS=',' read -ra LIST <<< "${{ steps.list_leagues.outputs.leagues }}"
          OK=0
          KO=0
          SKIP=0
          KO_CODES=""
          for code in "${LIST[@]}"; do
            f="live/data/tm_scrap/${code}.csv"
            # Skip si CSV absent OU vide (header seul = effectif non scrapé)
            if [ ! -f "$f" ] || [ "$(wc -l < "$f")" -le 1 ]; then
              SKIP=$((SKIP+1))
              continue
            fi
            echo "::group::Scraping carrière $code"
            # timeout 240s (4 min) par ligue : une ligue bloquée par TM
            # est abandonnée proprement sans tuer le reste du pipeline.
            if timeout 240 python3 tm_player_career.py --league "$code" --workers 5; then
              OK=$((OK+1))
            else
              EXIT=$?
              if [ $EXIT -eq 124 ]; then
                echo "::warning::Timeout ($code) — ligue ignorée, pipeline continue"
              else
                echo "::warning::Échec scraping $code (exit $EXIT)"
              fi
              KO=$((KO+1))
              KO_CODES="$KO_CODES $code"
            fi
            echo "::endgroup::"
          done
          # ── Retry pass : une seconde chance pour les ligues KO
          # (ex. : erreur réseau transitoire, TM momentanément lent)
          if [ -n "$KO_CODES" ]; then
            echo "=== Retry pass : $KO ligue(s) KO → nouvelle tentative ==="
            KO_RECOVERED=0
            KO_FINAL=0
            for code in $KO_CODES; do
              echo "::group::Retry carrière $code"
              if timeout 240 python3 tm_player_career.py --league "$code" --workers 5; then
                OK=$((OK+1))
                KO_RECOVERED=$((KO_RECOVERED+1))
              else
                KO_FINAL=$((KO_FINAL+1))
                echo "::warning::Retry définitivement échoué : $code"
              fi
              echo "::endgroup::"
            done
            echo "Retry : $KO_RECOVERED récupérée(s) / $KO_FINAL toujours KO"
            KO=$KO_FINAL
          fi
          echo "Bilan scraping : $OK OK / $KO KO / $SKIP skip (effectifs absents ou vides)"

      - name: Filtrer saison en cours pour chaque ligue
        # always() : tourne même si l'étape carrière a expiré ou échoué partiellement.
        # continue-on-error : si TM bloquait et que tous les CSV sont vides, on
        # continue quand même vers build/deploy avec les données committées précédemment.
        if: ${{ always() }}
        continue-on-error: true
        working-directory: artifacts/football-dashboard
        run: python3 scripts/make_current_season.py

      - name: Persister les CSV carrière sur main
        if: ${{ always() && github.event.inputs.skip_scrape != 'true' }}
        run: |
          # On commit les CSV carrière sur main pour qu'ils ne disparaissent
          # plus jamais, même si un futur run partiel + force_orphan rebâtit
          # gh-pages avec un sous-ensemble. Le repo source devient ainsi
          # la garantie ultime des 74 ligues.
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          # Resync au cas où l'étape "Persister effectifs" a déjà push
          git pull --rebase origin main || true
          # --force requis : ces répertoires étaient gitignorés avant le fix
          # du .gitignore ; git add sans --force les ignorerait encore.
          git add --force artifacts/football-dashboard/live/data/tm_career/ 2>/dev/null || true
          git add --force artifacts/football-dashboard/live/data/tm_career_current/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Aucun nouveau CSV carrière à committer."
          else
            count=$(git diff --cached --name-only | wc -l)
            git commit -m "chore(data): mise à jour CSV carrière (run #${{ github.run_number }}, $count fichiers)"
            git push origin HEAD:main || echo "::warning::push carrière échoué (continuera quand même)"
          fi

      - name: Construire la page GitHub Pages (HTML + ZIPs)
        if: ${{ always() }}
        working-directory: artifacts/football-dashboard
        run: python3 scripts/build_pages.py

      - name: Vérifier la sortie (non bloquant)
        if: ${{ always() }}
        working-directory: artifacts/football-dashboard
        # Étape jamais bloquante : on log un état même si 0 ZIP, pour permettre
        # un déploiement "dégradé" (page index avec sections "Pas encore scrapé").
        continue-on-error: true
        run: |
          set +e
          echo "--- Contenu gh_pages_build/ ---"
          ls -la gh_pages_build/ || true
          echo "--- Contenu gh_pages_build/data/ ---"
          ls -la gh_pages_build/data/ 2>/dev/null | head -20 || echo "(aucun dossier data/)"
          echo "---"
          zip_count=$(find gh_pages_build/data -maxdepth 1 -name "*.zip" 2>/dev/null | wc -l)
          echo "Total ZIPs : ${zip_count}"
          echo "Taille totale : $(du -sh gh_pages_build/ 2>/dev/null | cut -f1 || echo 'N/A')"
          if [ ! -f gh_pages_build/index.html ]; then
            echo "::warning::index.html introuvable — déploiement risque d'être vide"
          fi

      - name: Déployer sur GitHub Pages (branche gh-pages)
        if: ${{ always() }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./artifacts/football-dashboard/gh_pages_build
          publish_branch: gh-pages
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "chore(pages): refresh hebdomadaire ${{ github.run_number }}"
          # force_orphan garantit qu'à chaque déploiement la branche gh-pages
          # est réécrite avec un unique commit orphelin. Conséquence : aucun
          # tree historique (notamment ceux des runs #1 et #3 qui contenaient
          # le mapping erroné Slovaquie ⇄ Slovénie) ne reste référencé sur
          # la branche publique. Le portail GitHub Pages ne sert que le tip
          # de la branche, donc on supprime aussi toute trace consultable
          # via l'API git du repo.
          force_orphan: true

      - name: Résumé
        run: |
          echo "✅ Publication terminée."
          echo "URL probable : https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
