name: Scrape carrière TM hebdomadaire

# One campaign per ISO week (Paris): the first scheduled tick from Monday 05:00
# that finds the week without a campaign creates it; every other tick observes
# and resumes the EXISTING queue. The last step turns a late, blocked or missing
# week into a red run naming the leagues (tm_queue_completeness.py).
# GitHub cron can be delayed or dropped; no punctuality or source-access guarantee.
on:
  schedule:
    - cron: "15 3 * * 1"
    - cron: "15 4 * * 1"
    - cron: "37 * * * *"
  workflow_dispatch:
    inputs:
      leagues:
        description: "Ligues d'une nouvelle campagne ; vide = toutes"
        default: ""
      campaign_id:
        description: "Campagne durable existante ; vide = reprendre l'active ou créer"
        default: ""
      skip_scrape:
        description: "Reconstruction seule, sans modifier la file"
        default: "false"
        type: choice
        options: ["false", "true"]
      refresh_squads:
        description: "Rafraîchir les effectifs une fois par ligue/campagne"
        default: "true"
        type: choice
        options: ["true", "false"]
      retry_round:
        description: "Compatibilité anciens déclencheurs ; les reprises sont gérées par la file"
        default: "0"

permissions:
  contents: write
  actions: read
  pages: read

# ALL queue writers must use this same group. No dispatch from a worker.
concurrency:
  group: scrape-weekly
  cancel-in-progress: false

jobs:
  scrape-and-publish:
    # Image épinglée : ubuntu-latest bascule vers Ubuntu 26 (annonce GitHub du
    # 19/10/2026), risque pour « playwright install --with-deps ».
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
      TM_CHECKPOINT_REMOTE: github
      # Un seul flux, débit par paliers automatiques 0,8 → 1,0 → 1,2 → 1,5 →
      # 2,0 req/s (montée après 6 h sans refus, recul d'un palier au refus).
      # Ce réglage ne peut que BAISSER le plafond absolu codé à 2,0 ;
      # mettre "0.8" fige la collecte au palier initial.
      TM_RATE_CEILING: "2.0"
      # Collecte par run avant sauvegarde/publication (max 4,5 h, timeout 350 min ;
      # run #102 : 3 h de collecte pour 3 h 06 au total).
      TM_COLLECTION_HOURS: "4.5"
    steps:
      - uses: actions/checkout@v4
        with:
          # Un run mis en file derrière un autre (verrou scrape-weekly) doit partir de
          # l'état ACTUEL de main, pas du commit qui l'a déclenché : sinon le commit de
          # données du run précédent le fait échouer au « git pull --rebase » final
          # (conflit sur <ligue>_collection.json, run #106 du 03/11/2026).
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rattacher la file durable, créer la campagne de la semaine si elle manque et vérifier les publications précédentes
        id: queue
        if: inputs.skip_scrape != 'true'
        working-directory: artifacts/football-dashboard
        env:
          REQUESTED_LEAGUES: ${{ inputs.leagues }}
          REQUESTED_CAMPAIGN: ${{ inputs.campaign_id }}
          REFRESH_SQUADS: ${{ inputs.refresh_squads }}
          # Un passage planifié ne crée qu'une campagne complète par semaine ISO
          # (lundi 05:00 Paris, si la semaine n'en a pas encore) ; un lancement
          # manuel crée à la demande. La règle est dans collection_queue.prepare.
          ALLOW_CREATE: "true"
        run: python3 scripts/collection_queue.py prepare

      - name: Installer le navigateur seulement si la file autorise une collecte
        if: steps.queue.outputs.ready == 'true'
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: Collecter les ligues éligibles avec bilan durable
        id: collect
        if: steps.queue.outputs.ready == 'true'
        working-directory: artifacts/football-dashboard
        env:
          TM_CAMPAIGN_ID: ${{ steps.queue.outputs.campaign }}
        run: python3 scripts/collection_queue.py collect

      - name: Filtrer la saison courante
        id: current
        if: ${{ !cancelled() && (steps.queue.outputs.ready == 'true' || inputs.skip_scrape == 'true') }}
        working-directory: artifacts/football-dashboard
        run: python3 scripts/make_current_season.py

      - name: Persister les CSV validés sans supprimer les exports précédents
        id: persist
        if: ${{ !cancelled() && steps.queue.outputs.ready == 'true' && steps.current.outcome == 'success' }}
        run: |
          python3 artifacts/football-dashboard/career_export_transaction.py artifacts/football-dashboard/live/data/tm_career
          python3 artifacts/football-dashboard/career_export_transaction.py artifacts/football-dashboard/live/data/tm_career_current --current
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          find artifacts/football-dashboard/live/data/tm_scrap -maxdepth 1 -name '*.csv' -print0 | xargs -0 -r git add --
          find artifacts/football-dashboard/live/data/tm_career -maxdepth 1 -type f \
            \( -name '*_summary.csv' -o -name '*_career.csv' -o -name '*_matches.csv' -o -name '*_competitions_seen.csv' -o -name '*_collection.json' \) \
            -print0 | xargs -0 -r git add --force --
          find artifacts/football-dashboard/live/data/tm_career_current -maxdepth 1 -type f \
            \( -name '*_career.csv' -o -name '*_matches.csv' \) \
            -print0 | xargs -0 -r git add --force --
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): collecte campagne ${{ steps.queue.outputs.campaign }}"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Construire le portail et les deux archives par ligue
        id: build
        if: ${{ !cancelled() && steps.current.outcome == 'success' && (steps.persist.outcome == 'success' || inputs.skip_scrape == 'true') }}
        working-directory: artifacts/football-dashboard
        run: python3 scripts/build_pages.py

      - name: Enregistrer les empreintes CSV attendues avant publication
        id: seal
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.queue.outputs.ready == 'true' }}
        working-directory: artifacts/football-dashboard
        env:
          TM_CAMPAIGN_ID: ${{ steps.queue.outputs.campaign }}
        run: python3 scripts/collection_queue.py seal

      - name: Préserver toutes les archives de ligues déjà publiques
        id: preserve
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        working-directory: artifacts/football-dashboard
        run: python3 scripts/collection_queue.py guard

      - name: Déployer les archives
        if: ${{ !cancelled() && steps.preserve.outcome == 'success' && (steps.seal.outcome == 'success' || inputs.skip_scrape == 'true') }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./artifacts/football-dashboard/gh_pages_build
          publish_branch: gh-pages
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "chore(pages): campagne ${{ steps.queue.outputs.campaign }}"
          force_orphan: true

      - name: Bilan par ligue (publication publique vérifiée au prochain passage)
        if: ${{ always() && steps.queue.outputs.ready == 'true' }}
        working-directory: artifacts/football-dashboard
        env:
          TM_CAMPAIGN_ID: ${{ steps.queue.outputs.campaign }}
        run: python3 scripts/collection_queue.py finish

      # Dernière étape : son échec ne saute rien. Lecture seule de la file ; écrit le
      # bilan « N/78 ligues à jour » et échoue si une ligue risque de rater sa semaine
      # (campagne en retard ou bloquée, semaine sans campagne).
      - name: Contrôler la complétude hebdomadaire
        if: ${{ always() && inputs.skip_scrape != 'true' }}
        working-directory: artifacts/football-dashboard
        run: python3 scripts/collection_queue.py watch
