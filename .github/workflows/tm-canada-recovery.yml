name: Reprise limitée Canada
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: scrape-weekly
  cancel-in-progress: false
jobs:
  canada:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TM_CHECKPOINT_REMOTE: github
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer le navigateur
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      # Explicitly authorized limited recovery after successful access probe.
      # No global clearance, new campaign, automatic retry or portal publication.
      - name: Reprendre uniquement le Canada dans la campagne historique
        working-directory: artifacts/football-dashboard
        run: |
          python -u tm_player_career.py --league cdn1 \
            --campaign recovery-2026-10-28 --checkpoint-remote \
            --workers 1 --budget-seconds 240
      - name: Conserver les exports pour vérification avant publication
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canada-recovery-exports
          path: artifacts/football-dashboard/live/data/tm_career/cdn1_*
          if-no-files-found: warn
          retention-days: 30
