name: Diagnostic HTTP Transfermarkt (sans export)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tm-http-diagnostic
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer le navigateur
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Tests hors réseau
        working-directory: artifacts/football-dashboard
        run: python -m unittest test_tm_http_recovery test_tm_http_diagnostic -v
      - name: Paliers 6, 18, 36 joueurs — arrêt au premier échec, sans export
        working-directory: artifacts/football-dashboard
        run: python -u tm_http_diagnostic.py
      - name: Vérifier l'absence de modification des données
        if: always()
        run: |
          test -z "$(git status --porcelain --untracked-files=all -- artifacts/football-dashboard/live/data)"
      - name: Conserver uniquement les métriques anonymes du diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tm-http-diagnostic
          path: ${{ runner.temp }}/tm-http-diagnostic.json
          if-no-files-found: error
          retention-days: 14
