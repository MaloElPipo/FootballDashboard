name: Comparaison limitée des collectes parallèles
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scrape-weekly
  cancel-in-progress: false
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer le navigateur
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Comparer 1, 2, 3 et 5 collecteurs sur les mêmes échantillons
        working-directory: artifacts/football-dashboard
        run: python -u scripts/benchmark_collection.py
      - name: Conserver les mesures et les échantillons isolés
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tm-parallel-benchmark
          path: ${{ runner.temp }}/tm-parallel-benchmark/
          retention-days: 14
          if-no-files-found: warn
