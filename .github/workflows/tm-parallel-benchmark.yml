name: Comparaison limitée des collectes parallèles
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Comparaison courte ou cinq collecteurs uniquement"
        type: choice
        options: [compare, five]
        default: compare
      sample:
        description: "Joueurs par championnat"
        type: choice
        options: ["20", "200"]
        default: "20"
permissions:
  contents: read
concurrency:
  group: scrape-weekly
  cancel-in-progress: false
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer le navigateur
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Mesurer les collecteurs sur des échantillons isolés
        working-directory: artifacts/football-dashboard
        env:
          BENCHMARK_PROFILE: ${{ inputs.profile }}
          BENCHMARK_SAMPLE: ${{ inputs.sample }}
        run: python -u scripts/benchmark_collection.py
      - name: Conserver les mesures et les échantillons isolés
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tm-parallel-benchmark
          path: ${{ runner.temp }}/tm-parallel-benchmark/
          retention-days: 14
          if-no-files-found: warn
